<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM-bridge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      background: #0d1117;
      color: #c9d1d9;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #58a6ff;
      margin-right: auto;
    }

    select, button, input, textarea {
      font-family: inherit;
      font-size: 13px;
      color: #c9d1d9;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      outline: none;
    }

    select:focus, input:focus, textarea:focus {
      border-color: #58a6ff;
    }

    button {
      cursor: pointer;
      padding: 6px 12px;
      font-weight: 500;
    }

    button:hover { background: #30363d; }

    #session-select {
      padding: 6px 8px;
      min-width: 180px;
    }

    .btn-primary {
      background: #238636;
      border-color: #238636;
      color: #fff;
    }

    .btn-primary:hover { background: #2ea043; }

    .btn-danger {
      background: #da3633;
      border-color: #da3633;
      color: #fff;
    }

    .btn-danger:hover { background: #f85149; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 10px;
      line-height: 1.5;
      word-break: break-word;
    }

    .message-user {
      align-self: flex-end;
      background: #1f6feb;
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .message-assistant {
      align-self: flex-start;
      background: #21262d;
      border: 1px solid #30363d;
      border-bottom-left-radius: 2px;
    }

    .message-assistant pre {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
      font-family: inherit;
      font-size: 13px;
    }

    .message-error {
      align-self: center;
      background: #21262d;
      border: 1px solid #da3633;
      color: #f85149;
      font-size: 13px;
    }

    .streaming-cursor::after {
      content: '\u258B';
      animation: blink 0.8s infinite;
      color: #58a6ff;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    #options-panel {
      padding: 0 16px;
      flex-shrink: 0;
    }

    #options-toggle {
      background: none;
      border: none;
      color: #8b949e;
      font-size: 12px;
      padding: 8px 0;
      cursor: pointer;
    }

    #options-toggle:hover { color: #c9d1d9; }

    #options-fields {
      display: none;
      gap: 8px;
      padding-bottom: 8px;
    }

    #options-fields.open {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    #options-fields label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: #8b949e;
    }

    #options-fields label.full-width {
      grid-column: 1 / -1;
    }

    #options-fields input, #options-fields textarea {
      padding: 6px 8px;
      font-size: 12px;
    }

    #options-fields textarea {
      resize: vertical;
      min-height: 48px;
    }

    #input-area {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: #161b22;
      border-top: 1px solid #30363d;
      flex-shrink: 0;
    }

    #prompt-input {
      flex: 1;
      padding: 10px 12px;
      resize: none;
      min-height: 44px;
      max-height: 200px;
      line-height: 1.4;
    }

    #send-btn {
      align-self: flex-end;
      min-width: 64px;
      padding: 10px 16px;
    }

    #empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #484f58;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>LLM-bridge</h1>
    <select id="session-select">
      <option value="">One-shot (세션 없음)</option>
    </select>
    <button id="new-session-btn" class="btn-primary">+ 새 세션</button>
    <button id="delete-session-btn" class="btn-danger" style="display:none;">삭제</button>
  </header>

  <div id="chat">
    <div id="empty-state">프롬프트를 입력하세요</div>
  </div>

  <div id="options-panel">
    <button id="options-toggle">&#9654; 고급 옵션</button>
    <div id="options-fields">
      <label>
        Model
        <input type="text" id="opt-model" placeholder="e.g. claude-sonnet-4-6">
      </label>
      <label>
        Working Directory
        <input type="text" id="opt-workingDir" placeholder="/path/to/project">
      </label>
      <label>
        Permission Mode
        <input type="text" id="opt-permissionMode" placeholder="e.g. plan">
      </label>
      <label>
        Allowed Tools (쉼표 구분)
        <input type="text" id="opt-allowedTools" placeholder="e.g. Read,Grep,Glob">
      </label>
      <label class="full-width">
        System Prompt
        <textarea id="opt-systemPrompt" placeholder="시스템 프롬프트 (선택)"></textarea>
      </label>
    </div>
  </div>

  <div id="input-area">
    <textarea id="prompt-input" placeholder="프롬프트 입력... (Ctrl+Enter 전송)" rows="1"></textarea>
    <button id="send-btn" class="btn-primary">전송</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const emptyState = document.getElementById('empty-state');
    const promptInput = document.getElementById('prompt-input');
    const sendBtn = document.getElementById('send-btn');
    const sessionSelect = document.getElementById('session-select');
    const newSessionBtn = document.getElementById('new-session-btn');
    const deleteSessionBtn = document.getElementById('delete-session-btn');
    const optionsToggle = document.getElementById('options-toggle');
    const optionsFields = document.getElementById('options-fields');

    let isStreaming = false;
    let currentReader = null;

    // --- Session management ---

    async function loadSessions() {
      try {
        const res = await fetch('/sessions');
        const sessions = await res.json();
        // Keep first option (one-shot)
        sessionSelect.length = 1;
        sessions.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id || s.sessionId;
          const date = new Date(s.createdAt).toLocaleTimeString();
          const id = (s.id || s.sessionId).slice(0, 8);
          opt.textContent = `${id}... (${date})`;
          sessionSelect.appendChild(opt);
        });
      } catch { /* ignore */ }
    }

    newSessionBtn.addEventListener('click', async () => {
      try {
        const res = await fetch('/sessions', { method: 'POST' });
        const data = await res.json();
        await loadSessions();
        sessionSelect.value = data.sessionId;
        sessionSelect.dispatchEvent(new Event('change'));
      } catch (e) {
        addErrorMessage('세션 생성 실패: ' + e.message);
      }
    });

    deleteSessionBtn.addEventListener('click', async () => {
      const id = sessionSelect.value;
      if (!id) return;
      try {
        await fetch(`/sessions/${id}`, { method: 'DELETE' });
        await loadSessions();
        sessionSelect.value = '';
        sessionSelect.dispatchEvent(new Event('change'));
      } catch (e) {
        addErrorMessage('세션 삭제 실패: ' + e.message);
      }
    });

    sessionSelect.addEventListener('change', () => {
      deleteSessionBtn.style.display = sessionSelect.value ? '' : 'none';
    });

    // --- Options panel ---

    optionsToggle.addEventListener('click', () => {
      const open = optionsFields.classList.toggle('open');
      optionsToggle.innerHTML = (open ? '&#9660;' : '&#9654;') + ' 고급 옵션';
    });

    // --- Chat rendering ---

    function hideEmptyState() {
      if (emptyState) emptyState.style.display = 'none';
    }

    function addUserMessage(text) {
      hideEmptyState();
      const div = document.createElement('div');
      div.className = 'message message-user';
      div.textContent = text;
      chat.appendChild(div);
      scrollToBottom();
    }

    function createAssistantMessage() {
      hideEmptyState();
      const div = document.createElement('div');
      div.className = 'message message-assistant';
      const pre = document.createElement('pre');
      pre.className = 'streaming-cursor';
      div.appendChild(pre);
      chat.appendChild(div);
      scrollToBottom();
      return pre;
    }

    function addErrorMessage(text) {
      hideEmptyState();
      const div = document.createElement('div');
      div.className = 'message message-error';
      div.textContent = text;
      chat.appendChild(div);
      scrollToBottom();
    }

    function scrollToBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    // --- Prompt input auto-resize ---

    promptInput.addEventListener('input', () => {
      promptInput.style.height = 'auto';
      promptInput.style.height = Math.min(promptInput.scrollHeight, 200) + 'px';
    });

    // --- Send prompt ---

    function getOptions() {
      const opts = {};
      const model = document.getElementById('opt-model').value.trim();
      const workingDir = document.getElementById('opt-workingDir').value.trim();
      const permissionMode = document.getElementById('opt-permissionMode').value.trim();
      const allowedTools = document.getElementById('opt-allowedTools').value.trim();
      const systemPrompt = document.getElementById('opt-systemPrompt').value.trim();

      if (model) opts.model = model;
      if (workingDir) opts.workingDir = workingDir;
      if (permissionMode) opts.permissionMode = permissionMode;
      if (allowedTools) opts.allowedTools = allowedTools.split(',').map(s => s.trim()).filter(Boolean);
      if (systemPrompt) opts.systemPrompt = systemPrompt;

      return opts;
    }

    async function sendPrompt() {
      const prompt = promptInput.value.trim();
      if (!prompt || isStreaming) return;

      const sessionId = sessionSelect.value;
      const url = sessionId ? `/sessions/${sessionId}/prompt` : '/prompt';
      const body = { prompt, ...getOptions() };

      addUserMessage(prompt);
      promptInput.value = '';
      promptInput.style.height = 'auto';

      const pre = createAssistantMessage();
      setStreaming(true);

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        if (!res.ok) {
          let msg = `HTTP ${res.status}`;
          try {
            const err = await res.json();
            msg = err.message || msg;
          } catch { /* ignore */ }
          pre.parentElement.remove();
          addErrorMessage(msg);
          setStreaming(false);
          return;
        }

        currentReader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await currentReader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const jsonStr = line.slice(6);
            try {
              const event = JSON.parse(jsonStr);
              if (event.type === 'text') {
                pre.textContent += event.text;
                scrollToBottom();
              } else if (event.type === 'error') {
                addErrorMessage(event.error);
              }
              // 'done' event — stream will end naturally
            } catch { /* skip malformed */ }
          }
        }
      } catch (e) {
        if (e.name !== 'AbortError') {
          addErrorMessage('연결 오류: ' + e.message);
        }
      } finally {
        pre.classList.remove('streaming-cursor');
        if (!pre.textContent) {
          pre.parentElement.remove();
        }
        currentReader = null;
        setStreaming(false);
      }
    }

    function stopStreaming() {
      if (currentReader) {
        currentReader.cancel();
        currentReader = null;
      }
    }

    function setStreaming(streaming) {
      isStreaming = streaming;
      promptInput.disabled = streaming;
      sendBtn.textContent = streaming ? '중지' : '전송';
      sendBtn.className = streaming ? 'btn-danger' : 'btn-primary';
      if (!streaming) promptInput.focus();
    }

    // --- Event listeners ---

    sendBtn.addEventListener('click', () => {
      if (isStreaming) {
        stopStreaming();
      } else {
        sendPrompt();
      }
    });

    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        sendPrompt();
      }
    });

    // --- Init ---
    loadSessions();
    promptInput.focus();
  </script>
</body>
</html>
